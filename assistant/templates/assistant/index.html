{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'assistant/css/assistant.css' %}" />
  </head>
  <body>
    <div class="ambient-glow"></div>

    <div class="chat-container">
      <!-- Header -->
      <header>
        <div class="brand">
          <div class="avatar-main">S</div>
          <div class="brand-info">
            <h1>AI Assistant</h1>
          </div>
        </div>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span>Online</span>
        </div>
      </header>

      <!-- Messages Feed -->
      <div class="messages-area" id="messagesArea">
        <div class="message-row assistant">
          <div class="msg-avatar">S</div>
          <div class="msg-bubble">
            Hello! I am Shifra, your AI assistant powered by Hugging Face. How can I help you today?
            <button class="copy-btn" onclick="copyMessage(this)" title="Copy message">
              <svg viewBox="0 0 24 24">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
              </svg>
            </button>
            <div class="copy-tooltip">Copied!</div>
          </div>
        </div>
      </div>

      <!-- Quick Suggestion Chips -->
      <div class="suggestions-bar">
        <div
          class="chip"
          onclick="sendSuggestion('who is the president of india')"
        >
          💡 President of India
        </div>
        <div class="chip" onclick="sendSuggestion('tell me a joke')">
          🎭 Tell me a joke
        </div>
        <div class="chip" onclick="sendSuggestion('what is the time')">
          🕒 What time is it?
        </div>
        <div class="chip" onclick="sendSuggestion('open notepad')">
          📝 Open Notepad
        </div>
        <div class="chip" onclick="sendSuggestion('list available commands')">
          ⚛️ Show Commands
        </div>
      </div>

      <!-- Input Form -->
      <form class="input-area" id="commandForm">
        <div class="input-wrapper">
          <input
            type="text"
            id="commandInput"
            placeholder="Ask Shifra anything or type a command..."
            autocomplete="off"
            required
          />
        </div>
        <button type="submit" class="send-btn" id="sendBtn">
          <span>Send</span>
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </form>
    </div>

    <script>
      const form = document.getElementById("commandForm");
      const input = document.getElementById("commandInput");
      const sendBtn = document.getElementById("sendBtn");
      const messagesArea = document.getElementById("messagesArea");

      function copyMessage(btn) {
        const bubble = btn.closest(".msg-bubble");
        // Clone and remove button/tooltip text to get clean text
        const textToCopy = bubble.childNodes[0].textContent.trim();
        
        navigator.clipboard.writeText(textToCopy).then(() => {
          btn.classList.add("copied");
          const tooltip = bubble.querySelector(".copy-tooltip");
          if (tooltip) {
            tooltip.classList.add("show");
            setTimeout(() => {
              tooltip.classList.remove("show");
              btn.classList.remove("copied");
            }, 1800);
          }
        }).catch(err => {
          console.error("Failed to copy: ", err);
        });
      }

      function appendMessage(text, sender) {
        const rowDiv = document.createElement("div");
        rowDiv.className = `message-row ${sender}`;

        const avatarDiv = document.createElement("div");
        avatarDiv.className = "msg-avatar";
        avatarDiv.textContent = sender === "assistant" ? "S" : "U";

        const bubbleDiv = document.createElement("div");
        bubbleDiv.className = "msg-bubble";
        bubbleDiv.textContent = text;

        if (sender === "assistant") {
          const copyBtn = document.createElement("button");
          copyBtn.className = "copy-btn";
          copyBtn.title = "Copy message";
          copyBtn.setAttribute("onclick", "copyMessage(this)");
          copyBtn.innerHTML = `
            <svg viewBox="0 0 24 24">
              <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
          `;
          
          const tooltip = document.createElement("div");
          tooltip.className = "copy-tooltip";
          tooltip.textContent = "Copied!";

          bubbleDiv.appendChild(copyBtn);
          bubbleDiv.appendChild(tooltip);
        }

        rowDiv.appendChild(avatarDiv);
        rowDiv.appendChild(bubbleDiv);

        messagesArea.appendChild(rowDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }

      function showTypingIndicator() {
        const rowDiv = document.createElement("div");
        rowDiv.className = "message-row assistant";
        rowDiv.id = "typingRow";

        const avatarDiv = document.createElement("div");
        avatarDiv.className = "msg-avatar";
        avatarDiv.textContent = "S";

        const typingDiv = document.createElement("div");
        typingDiv.className = "typing-container";
        typingDiv.innerHTML = `
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        `;

        rowDiv.appendChild(avatarDiv);
        rowDiv.appendChild(typingDiv);

        messagesArea.appendChild(rowDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }

      function removeTypingIndicator() {
        const typingRow = document.getElementById("typingRow");
        if (typingRow) {
          typingRow.remove();
        }
      }

      function sendSuggestion(text) {
        input.value = text;
        form.dispatchEvent(new Event("submit"));
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const command = input.value.trim();
        if (!command) return;

        appendMessage(command, "user");
        input.value = "";

        showTypingIndicator();
        input.disabled = true;
        sendBtn.disabled = true;

        try {
          const response = await fetch("/api/command/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ command: command }),
          });

          const data = await response.json();
          removeTypingIndicator();

          if (
            data.status === "success" &&
            data.responses &&
            data.responses.length > 0
          ) {
            data.responses.forEach((resp) => appendMessage(resp, "assistant"));
          } else if (data.message) {
            appendMessage(data.message, "assistant");
          } else {
            appendMessage("Command executed.", "assistant");
          }
        } catch (err) {
          removeTypingIndicator();
          appendMessage(
            "Error communicating with Django backend.",
            "assistant",
          );
        } finally {
          input.disabled = false;
          sendBtn.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
