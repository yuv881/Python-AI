<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-dark: #090d16;
        --card-bg: rgba(18, 24, 38, 0.75);
        --card-border: rgba(255, 255, 255, 0.08);
        --accent-primary: #6366f1;
        --accent-glow: #818cf8;
        --accent-cyan: #06b6d4;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --user-bubble: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        --assistant-bubble: rgba(30, 41, 59, 0.7);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 70%);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow: hidden;
      }

      /* Ambient background lighting */
      .ambient-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.15) 0%,
          rgba(6, 182, 212, 0.05) 50%,
          transparent 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 0;
      }

      .chat-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 900px;
        height: 92vh;
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        box-shadow:
          0 30px 60px -12px rgba(0, 0, 0, 0.6),
          0 0 40px rgba(99, 102, 241, 0.15);
        overflow: hidden;
      }

      header {
        padding: 20px 28px;
        background: rgba(13, 18, 30, 0.7);
        border-bottom: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .avatar-main {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Outfit", sans-serif;
        font-weight: 700;
        font-size: 22px;
        color: white;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      }

      .brand-info h1 {
        font-family: "Outfit", sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .brand-info p {
        font-size: 13px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .badge-ai {
        background: rgba(99, 102, 241, 0.15);
        color: #818cf8;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
      }

      .status-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.25);
        border-radius: 20px;
        font-size: 13px;
        color: #34d399;
        font-weight: 500;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 10px #34d399;
      }

      /* Messages area & Custom Scrollbar */
      .messages-area {
        flex: 1;
        padding: 28px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        scroll-behavior: smooth;
      }

      .messages-area::-webkit-scrollbar {
        width: 6px;
      }

      .messages-area::-webkit-scrollbar-track {
        background: transparent;
      }

      .messages-area::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }

      .messages-area::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.4);
      }

      .message-row {
        display: flex;
        gap: 12px;
        max-width: 85%;
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-row.assistant {
        align-self: flex-start;
      }

      .message-row.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .msg-avatar {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .message-row.assistant .msg-avatar {
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
        color: white;
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
      }

      .message-row.user .msg-avatar {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-main);
        border: 1px solid var(--card-border);
      }

      .msg-bubble {
        padding: 16px 20px;
        border-radius: 20px;
        line-height: 1.6;
        font-size: 15px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message-row.assistant .msg-bubble {
        background: var(--assistant-bubble);
        border: 1px solid var(--card-border);
        border-top-left-radius: 4px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }

      .message-row.user .msg-bubble {
        background: var(--user-bubble);
        border-top-right-radius: 4px;
        box-shadow: 0 6px 24px rgba(79, 70, 229, 0.35);
      }

      /* 3 Bouncing Dots Typing Animation */
      .typing-container {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 14px 20px;
        background: var(--assistant-bubble);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        border-top-left-radius: 4px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }

      .dot {
        width: 9px;
        height: 9px;
        background: linear-gradient(135deg, #818cf8, #06b6d4);
        border-radius: 50%;
        animation: bounceWave 1.4s infinite ease-in-out both;
        box-shadow: 0 0 8px rgba(129, 140, 248, 0.6);
      }

      .dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .dot:nth-child(2) {
        animation-delay: -0.16s;
      }
      .dot:nth-child(3) {
        animation-delay: 0s;
      }

      @keyframes bounceWave {
        0%,
        80%,
        100% {
          transform: translateY(0) scale(0.7);
          opacity: 0.4;
        }
        40% {
          transform: translateY(-8px) scale(1.1);
          opacity: 1;
        }
      }

      /* Suggestion Chips */
      .suggestions-bar {
        padding: 0 28px 12px 28px;
        display: flex;
        gap: 10px;
        overflow-x: auto;
        scroll-behavior: smooth;
      }

      .suggestions-bar::-webkit-scrollbar {
        display: none;
      }

      .chip {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 13px;
        color: var(--text-muted);
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .chip:hover {
        background: rgba(99, 102, 241, 0.15);
        border-color: rgba(99, 102, 241, 0.4);
        color: var(--text-main);
        transform: translateY(-2px);
      }

      /* Input Area */
      .input-area {
        padding: 20px 28px;
        background: rgba(13, 18, 30, 0.7);
        border-top: 1px solid var(--card-border);
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .input-wrapper {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
      }

      input[type="text"] {
        width: 100%;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 16px 22px;
        color: var(--text-main);
        font-size: 15px;
        outline: none;
        transition: all 0.25s ease;
      }

      input[type="text"]:focus {
        border-color: var(--accent-primary);
        background: rgba(30, 41, 59, 0.9);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
      }

      input[type="text"]::placeholder {
        color: #64748b;
      }

      button.send-btn {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        color: white;
        border: none;
        border-radius: 16px;
        padding: 0 28px;
        height: 54px;
        font-family: "Outfit", sans-serif;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      }

      button.send-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.5);
        background: linear-gradient(135deg, #818cf8 0%, #4f46e5 100%);
      }

      button.send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      button.send-btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        transition: transform 0.2s ease;
      }

      button.send-btn:hover svg {
        transform: translateX(3px);
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow"></div>

    <div class="chat-container">
      <!-- Header -->
      <header>
        <div class="brand">
          <div class="avatar-main">S</div>
          <div class="brand-info">
            <h1>AI Assistant</h1>
          </div>
        </div>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span>Online</span>
        </div>
      </header>

      <!-- Messages Feed -->
      <div class="messages-area" id="messagesArea">
        <div class="message-row assistant">
          <div class="msg-avatar">S</div>
          <div class="msg-bubble">
            Hello! I am Shifra, your AI assistant powered by Hugging Face. How
            can I help you today?
          </div>
        </div>
      </div>

      <!-- Quick Suggestion Chips -->
      <div class="suggestions-bar">
        <div
          class="chip"
          onclick="sendSuggestion('who is the president of india')"
        >
          💡 President of India
        </div>
        <div class="chip" onclick="sendSuggestion('tell me a joke')">
          🎭 Tell me a joke
        </div>
        <div class="chip" onclick="sendSuggestion('what is the time')">
          🕒 What time is it?
        </div>
        <div class="chip" onclick="sendSuggestion('open notepad')">
          📝 Open Notepad
        </div>
        <div
          class="chip"
          onclick="sendSuggestion('explain quantum computing in simple terms')"
        >
          ⚛️ Quantum Computing
        </div>
      </div>

      <!-- Input Form -->
      <form class="input-area" id="commandForm">
        <div class="input-wrapper">
          <input
            type="text"
            id="commandInput"
            placeholder="Ask Shifra anything or type a command..."
            autocomplete="off"
            required
          />
        </div>
        <button type="submit" class="send-btn" id="sendBtn">
          <span>Send</span>
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </form>
    </div>

    <script>
      const form = document.getElementById("commandForm");
      const input = document.getElementById("commandInput");
      const sendBtn = document.getElementById("sendBtn");
      const messagesArea = document.getElementById("messagesArea");

      function appendMessage(text, sender) {
        const rowDiv = document.createElement("div");
        rowDiv.className = `message-row ${sender}`;

        const avatarDiv = document.createElement("div");
        avatarDiv.className = "msg-avatar";
        avatarDiv.textContent = sender === "assistant" ? "S" : "U";

        const bubbleDiv = document.createElement("div");
        bubbleDiv.className = "msg-bubble";
        bubbleDiv.textContent = text;

        rowDiv.appendChild(avatarDiv);
        rowDiv.appendChild(bubbleDiv);

        messagesArea.appendChild(rowDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }

      function showTypingIndicator() {
        const rowDiv = document.createElement("div");
        rowDiv.className = "message-row assistant";
        rowDiv.id = "typingRow";

        const avatarDiv = document.createElement("div");
        avatarDiv.className = "msg-avatar";
        avatarDiv.textContent = "S";

        const typingDiv = document.createElement("div");
        typingDiv.className = "typing-container";
        typingDiv.innerHTML = `
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            `;

        rowDiv.appendChild(avatarDiv);
        rowDiv.appendChild(typingDiv);

        messagesArea.appendChild(rowDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }

      function removeTypingIndicator() {
        const typingRow = document.getElementById("typingRow");
        if (typingRow) {
          typingRow.remove();
        }
      }

      function sendSuggestion(text) {
        input.value = text;
        form.dispatchEvent(new Event("submit"));
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const command = input.value.trim();
        if (!command) return;

        appendMessage(command, "user");
        input.value = "";

        // Show typing indicator with 3 bouncing dots
        showTypingIndicator();
        input.disabled = true;
        sendBtn.disabled = true;

        try {
          const response = await fetch("/api/command/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ command: command }),
          });

          const data = await response.json();
          removeTypingIndicator();

          if (
            data.status === "success" &&
            data.responses &&
            data.responses.length > 0
          ) {
            data.responses.forEach((resp) => appendMessage(resp, "assistant"));
          } else if (data.message) {
            appendMessage(data.message, "assistant");
          } else {
            appendMessage("Command executed.", "assistant");
          }
        } catch (err) {
          removeTypingIndicator();
          appendMessage(
            "Error communicating with Django backend.",
            "assistant",
          );
        } finally {
          input.disabled = false;
          sendBtn.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
